<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatares Corporativos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .avatar-container {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #2d4257;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #436f90;
        }
    </style>
</head>
<body>

    <div class="avatar-container" id="contenedor-avatar">
        <!-- Avatar Hombre -->
        <svg id="avatar-hombre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
            <circle cx="50" cy="50" r="46" fill="#cce0f5" stroke="#000" stroke-width="4"/>
            <path d="M20,96 C20,70 80,70 80,96" fill="#436f90" stroke="#000" stroke-width="4"/>
            <polygon points="35,70 50,85 65,70" fill="#ffffff" stroke="#000" stroke-width="3"/>
            <polygon points="48,78 45,96 55,96 52,78" fill="#d95a63" stroke="#000" stroke-width="3"/>
            <rect x="42" y="55" width="16" height="20" fill="#ffdac2" stroke="#000" stroke-width="4"/>
            <rect x="30" y="30" width="40" height="35" rx="15" fill="#ffdac2" stroke="#000" stroke-width="4"/>
            <path d="M28,45 C25,25 40,20 50,20 C65,20 75,25 72,45 C75,30 60,25 50,25 C35,25 25,30 28,45 Z" fill="#2d4257" stroke="#000" stroke-width="3"/>
        </svg>

        <!-- Avatar Mujer (Oculto por defecto) -->
        <svg id="avatar-mujer" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" style="display: none;">
            <circle cx="50" cy="50" r="46" fill="#cce0f5" stroke="#000" stroke-width="4"/>
            <path d="M20,96 C20,70 80,70 80,96" fill="#436f90" stroke="#000" stroke-width="4"/>
            <polygon points="35,70 50,80 65,70" fill="#ffffff" stroke="#000" stroke-width="3"/>
            <rect x="42" y="55" width="16" height="20" fill="#ffdac2" stroke="#000" stroke-width="4"/>
            <rect x="30" y="30" width="40" height="35" rx="15" fill="#ffdac2" stroke="#000" stroke-width="4"/>
            <path d="M28,45 C25,20 40,15 50,15 C65,15 75,20 72,45 C72,60 76,75 80,80 C70,75 70,60 72,45 C65,25 40,25 28,45 C30,60 30,75 20,80 C24,75 28,60 28,45 Z" fill="#2d4257" stroke="#000" stroke-width="3"/>
        </svg>
    </div>

    <button onclick="cambiarAvatar()">Cambiar a Mujer</button>

    <script>
        function cambiarAvatar() {
            const avatarHombre = document.getElementById('avatar-hombre');
            const avatarMujer = document.getElementById('avatar-mujer');
            const boton = document.querySelector('button');
            
            if (avatarHombre.style.display !== 'none') {
                avatarHombre.style.display = 'none';
                avatarMujer.style.display = 'block';
                boton.textContent = 'Cambiar a Hombre';
            } else {
                avatarHombre.style.display = 'block';
                avatarMujer.style.display = 'none';
                boton.textContent = 'Cambiar a Mujer';
            }
        }
    </script>
</body>
</html>
