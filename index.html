<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Stats & Perfil - 个人属性卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-page: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent-blue: #4d7cfe;
      --accent-light: rgba(77, 124, 254, 0.12);
      --border-color: #edf2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

.main-card {
  width: 100%;
  max-width: 620px;
  background: var(--card-bg);
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  padding: 70px 24px 28px; /* ← más espacio arriba */
  position: relative;
}

.lang-switcher {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #f1f5f9;
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  color: var(--accent-blue);
  transition: all 0.2s;
}


    .lang-switcher:hover {
      background: var(--accent-light);
    }

    .step-card { display: none; }
    .step-card.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2.title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.subtitle { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .input-field {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color);
      border-radius: 12px; font-family: inherit; font-size: 0.95rem; outline: none; background: #fff;
    }
    .textarea-field {
      width: 100%; min-height: 120px; padding: 14px 16px; border: 1.5px solid var(--border-color);
      border-radius: 12px; font-family: inherit; font-size: 0.95rem; outline: none; background: #fff;
      resize: vertical; line-height: 1.5;
    }
    .textarea-field:focus, .input-field:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .sexo-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sexo-btn {
      background: #f8fafc; border: 1.5px solid var(--border-color); border-radius: 14px;
      padding: 14px 16px; cursor: pointer; text-align: center; font-size: 0.95rem;
      font-weight: 600; transition: all 0.2s;
    }
    .sexo-btn:hover { border-color: #cbd5e1; background: #f1f5f9; }
    .sexo-btn.selected { border-color: var(--accent-blue); background: var(--accent-light); color: var(--accent-blue); }
    .input-helper { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }

    .opcion-btn {
      background: #f8fafc; border: 1.5px solid var(--border-color); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center;
      transition: all 0.2s; font-size: 0.9rem; font-weight: 500; line-height: 1.4;
    }

    .opcion-btn:hover { border-color: #cbd5e1; background: #f1f5f9; }
    .opcion-btn.selected { border-color: var(--accent-blue); background: var(--accent-light); color: var(--accent-blue); font-weight: 600; }

    .btn-action {
      width: 100%; background: var(--accent-blue); color: #fff; border: none; border-radius: 14px;
      padding: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 12px;
      box-shadow: 0 4px 12px rgba(77, 124, 254, 0.3);
    }

    #resultado-screen { display: none; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
    @media (max-width: 500px) { .profile-grid { grid-template-columns: 1fr; } }
.opcion-btn.selected {
  border-color: var(--accent-blue);
  background: var(--accent-light);
  color: var(--accent-blue);
  font-weight: 600;
}
    .info-col { display: flex; flex-direction: column; justify-content: center; }
    .user-emoji {
      text-align: center;
      margin-bottom: 12px;
      font-size: 3rem;
      line-height: 1;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-name-box { background: #f8fafc; padding: 8px 16px; border-radius: 20px; font-size: 1.2rem; font-weight: 800; text-align: center; margin-bottom: 16px; }
    .info-list { display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
    .info-item { display: flex; align-items: flex-start; gap: 8px; color: var(--text-muted); }

    .chart-col { display: flex; justify-content: center; align-items: center; }
    .chart-box { width: 290px; height: 290px; flex: 0 0 290px; display: flex; justify-content: center; align-items: center; }
    .chart-box canvas { width: 290px !important; height: 290px !important; display: block; }

    .stats-badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .stat-badge-item { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 4px; text-align: center; }
    .stat-badge-icon { font-size: 1.1rem; display: block; }
    .stat-badge-name { font-size: 0.7rem; font-weight: 700; color: var(--text-main); }
    .stat-badge-val { font-size: 0.75rem; font-weight: 800; color: var(--accent-blue); }
    .stat-badge-level { font-size: 0.65rem; background: #e0f2fe; color: #0369a1; border-radius: 10px; padding: 1px 6px; display: inline-block; margin-top: 2px; }

    .keywords-section { padding-top: 16px; }
    .keywords-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
    .tags-flex { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .tag-yellow { background: #fef3c7; color: #d97706; }
    .tag-blue { background: #e0f2fe; color: #0284c7; }
    .tag-green { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

  <div class="main-card">
    <button class="lang-switcher" onclick="toggleLang()" id="lang-btn">中文</button>

   <!-- PASO 0: INFORMACIÓN INICIAL BÁSICA -->

      <div class="form-group">

            <span data-zh="男生" data-es="Hombre">Hombre</span>
          </div>
          <div class="sexo-btn" role="button" tabindex="0" onclick="seleccionarSexo(this, 'mujer')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();seleccionarSexo(this,'mujer');}">
            <span data-zh="女生" data-es="Mujer">Mujer</span>
          </div>
        </div>
      </div>

      <button type="button" class="btn-action" onclick="iniciarPreguntas()" data-zh="开始测试 →" data-es="Comenzar →">Comenzar →</button>
    </div>
    
    <!-- CUESTIONARIO -->
    <form id="quizForm">
      <div id="preguntas-container"></div>
    </form>

    <!-- RESULTADO -->
    <div id="resultado-screen">
      <div class="profile-grid">
        <div class="info-col">

          <div class="info-list">
            <div class="info-item"><span class="icon">🎂</span><div><span data-zh="年龄" data-es="Edad">Edad</span>: <strong id="res-edad">22+</strong></div></div>
            <div class="info-item"><span class="icon">📍</span><div><span data-zh="教会" data-es="Iglesia">Iglesia</span>: <strong id="res-iglesia">Norte</strong></div></div>
            <div class="info-item"><span class="icon">⭐</span><div><span data-zh="擅长" data-es="Se le da bien">Se le da bien</span>: <strong id="res-habilidad">-</strong></div></div>
            <div class="info-item">
  <span class="icon">🎨</span>
  <div><span data-zh="爱好" data-es="Hobbie">Hobbie</span>: <strong id="res-hobbie">-</strong></div>
</div>
<div class="info-item">
  <span class="icon">💬</span>
  <div><span data-zh="座右铭" data-es="Frase">Frase</span>: <strong id="res-frase">-</strong></div>
</div>
          </div>
        </div>

        <div class="chart-col">

            <canvas id="radarChart"></canvas>
          </div>
        </div>
      </div>

      <div class="stats-badges-grid" id="stats-badges"></div>

      <div class="keywords-section">
        <div class="keywords-title" data-zh="我的关键词" data-es="Mis Palabras Clave">Mis Palabras Clave</div>
        <div class="tags-flex">
          <span class="tag tag-yellow" data-zh="好奇" data-es="Curioso">Curioso</span>
          <span class="tag tag-blue" data-zh="专注" data-es="Enfocado">Enfocado</span>
          <span class="tag tag-green" data-zh="靠谱" data-es="Confiable">Confiable</span>

          <span class="tag tag-blue" data-zh="一起玩" data-es="Sociable">Sociable</span>

    function buildFallback() {
      return {
        role_key: "EXPLORADOR",
        core_type: { es: "Ventaja Relativa", zh: "相对优势" },
        strong_dimensions: [{ es: "Capacidad General", zh: "综合能力" }],
        description: ROLE_DESCRIPTIONS["EXPLORADOR"],
        is_absolute: false
      };
    }

    function breakTies(candidates) {
      candidates.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        let pA = TIE_BREAK_PRIORITY.indexOf(a.role);
        let pB = TIE_BREAK_PRIORITY.indexOf(b.role);
        return (pA === -1 ? 999 : pA) - (pB === -1 ? 999 : pB);
      });
      return candidates[0].role;
    }

    function classifyRole(scoresMap) {
      try {
        const scores = {
          'P': scoresMap.fis || 0, 'B': scoresMap.int || 0, 'E': scoresMap.exp || 0,
          'C': scoresMap.com || 0, 'T': scoresMap.col || 0, 'A': scoresMap.ada || 0
        };

        const dims = ['P', 'B', 'E', 'C', 'T', 'A'];
        const six_tier_dims = dims.filter(d => scores[d] >= 21);
        const six_tier_count = six_tier_dims.length;

        // PART A — HIGH-SCORE / ABSOLUTE-STRENGTH
        if (six_tier_count >= 1) {
          let core_type = CORE_TYPE_NAMES[six_tier_count];
          let strong_dims = six_tier_dims.map(d => ({
            es: `${DIM_NAMES[d].es} MAX`,
            zh: `${DIM_NAMES[d].zh} MAX`
          }));
          let role_key = "", desc = null;

          if (six_tier_count === 6) {
            role_key = "MULTIFACETICO";
            desc = {
              es: "Sobresales en los seis aspectos; eres un perfil sumamente completo y equilibrado.",
              zh: "六个方向都非常突出，是非常均衡的综合型选手。"
            };
          } else if (six_tier_count === 1) {
            let primary_dim = six_tier_dims[0];
            let singleObj = SINGLE_ROLES[primary_dim];
            role_key = singleObj.es; // Referencia
            let tier5_dims = dims.filter(d => scores[d] >= 17 && scores[d] <= 20);
            if (tier5_dims.length > 0) {
              strong_dims.push(...tier5_dims.map(d => ({
                es: `${DIM_NAMES[d].es} (Secundario)`,
                zh: `${DIM_NAMES[d].zh} (次要优势)`
              })));
            }
            desc = ROLE_DESCRIPTIONS[singleObj.es] || ROLE_DESCRIPTIONS["EXPLORADOR"];
          } else {
            let candidate_scores = {};
            PAIR_ROLE_MAP.forEach(item => {
              if (item.pair.every(d => six_tier_dims.includes(d))) {
                let pair_score = scores[item.pair[0]] + scores[item.pair[1]];
                candidate_scores[item.role] = Math.max(candidate_scores[item.role] || 0, pair_score);
              }
            });

            let candidates = Object.keys(candidate_scores).map(r => ({ role: r, score: candidate_scores[r] }));
            if (candidates.length > 0) {
              role_key = breakTies(candidates);
            } else {
              role_key = "MULTIFACETICO";
            }
            desc = ROLE_DESCRIPTIONS[role_key] || ROLE_DESCRIPTIONS["MULTIFACETICO"];
          }

          return { role_key: role_key, core_type: core_type, strong_dimensions: strong_dims, description: desc, is_absolute: true };
        }

        // PART B — NO 6-TIER / RELATIVE-STRENGTH
        let sorted_dims = [...dims].sort((a, b) => scores[b] - scores[a]);
        let s1_dim = sorted_dims[0], s2_dim = sorted_dims[1];
        let s1 = scores[s1_dim], s2 = scores[s2_dim];

        let vals = Object.values(scores);
        let max_score = Math.max(...vals), min_score = Math.min(...vals);
        let avg_score = vals.reduce((a, b) => a + b, 0) / 6.0;

        // B1 — VERY LOW AND FLAT
        if (max_score <= 8 && (s1 - s2 < 4)) {
          return {
            role_key: "EXPLORADOR",
            core_type: { es: "Ventaja Relativa", zh: "相对优势" },
            strong_dimensions: [{ es: "Exploración General", zh: "综合探索" }],
            description: {
              es: "Aún no hay un área marcadamente dominante; ideal para probar diferentes roles y encontrar tu lugar.",
              zh: "目前还没有特别明显的优势方向，适合在不同任务中多尝试，找到自己的主场。"
            },
            is_absolute: false
          };
        }

        // B2 — BALANCED PROFILE
        if (max_score - min_score <= 4) {
          if (avg_score >= 15) {
            return {
              role_key: "MULTIFACETICO",
              core_type: { es: "Ventaja Relativa", zh: "相对优势" },
              strong_dimensions: [{ es: "Equilibrio Séxtuple", zh: "六项均衡" }],
              description: ROLE_DESCRIPTIONS["MULTIFACETICO"],
              is_absolute: false
            };
          } else {
            return {
              role_key: "EXPLORADOR",
              core_type: { es: "Ventaja Relativa", zh: "相对优势" },
              strong_dimensions: [{ es: "Habilidades Equilibradas", zh: "能力均衡" }],
              description: {
                es: "Tus capacidades están muy repartidas sin un rol fijo; perfecto para adaptarse según la situación.",
                zh: "能力分布比较均衡，没有特别固定的角色，适合在不同任务中寻找自己的主场。"
              },
              is_absolute: false
            };
          }
        }

        // B3 — CLEAR SINGLE RELATIVE STRENGTH
        if (s1 - s2 >= 4) {
          let singleObj = SINGLE_ROLES[s1_dim];
          return {
            role_key: singleObj.es,
            core_type: { es: `Ventaja Relativa: ${DIM_NAMES[s1_dim].es}`, zh: `相对优势：${DIM_NAMES[s1_dim].zh}` },
            strong_dimensions: [{ es: `Ventaja Relativa: ${DIM_NAMES[s1_dim].es}`, zh: `相对优势：${DIM_NAMES[s1_dim].zh}` }],
            description: {
              es: `Entre tus seis resultados, ${DIM_NAMES[s1_dim].es} es tu área más destacada.`,
              zh: `在你的六项结果中，${DIM_NAMES[s1_dim].zh}是比较突出的方向。`
            },
            is_absolute: false
          };
        }

        // B4 — TWO OR MORE RELATIVE STRENGTHS
        let top_dims = dims.filter(d => scores[s1_dim] - scores[d] <= 2);
        if (top_dims.length === 1) top_dims.push(s2_dim);

        let pair_votes = {}, pair_scores = {};
        for (let i = 0; i < top_dims.length; i++) {
          for (let j = i + 1; j < top_dims.length; j++) {
            let p1 = top_dims[i], p2 = top_dims[j];
            let match = PAIR_ROLE_MAP.find(item => item.pair.includes(p1) && item.pair.includes(p2));
            if (match) {
              let rName = match.role;
              let pScore = scores[p1] + scores[p2];
              pair_votes[rName] = (pair_votes[rName] || 0) + 1;
              pair_scores[rName] = Math.max(pair_scores[rName] || 0, pScore);
            }
          }
        }

        let role_key = "";
        if (Object.keys(pair_votes).length > 0) {
          let max_votes = Math.max(...Object.values(pair_votes));
          let top_roles = Object.keys(pair_votes).filter(r => pair_votes[r] === max_votes);
          let candidates = top_roles.map(r => ({ role: r, score: pair_scores[r] }));
          role_key = breakTies(candidates);
        } else {
          role_key = "EXPLORADOR";
        }

        return {
          role_key: role_key,
          core_type: { es: "Ventaja Relativa", zh: "相对优势" },
          strong_dimensions: top_dims.map(d => ({ es: `Ventaja Relativa: ${DIM_NAMES[d].es}`, zh: `相对优势：${DIM_NAMES[d].zh}` })),
          description: ROLE_DESCRIPTIONS[role_key] || ROLE_DESCRIPTIONS["EXPLORADOR"],
          is_absolute: false
        };

      } catch (e) {
        return buildFallback();
      }
    }

          { label: { zh: "C. 感觉再争下去也没结果，直接喊组长或者裁判来主持公道", es: "C. Siento que seguir discutiendo no va a servir de nada, así que llamo directamente al líder del grupo o al árbitro para que haga de mediador." }, scores: { com: 2, ada: 3 } },
          { label: { zh: "D. 吃瓜，已经到了谁都能理解的年纪了", es: "D. Yo solo estoy aquí para ver el espectáculo. A estas alturas, ya somos todos mayorcitos como para entendernos." }, scores: { com: 0 } }

        options: [

          { label: { zh: "B. 还是会争取一下，比如看看能不能把自己方案里比较好的部分融入新方案", es: "B. Intento defender mi propuesta una vez más. Por ejemplo, trato de incorporar las mejores ideas de la mía a la nueva." }, scores: { exp: 2, com: 3, col: 3, ada: 3 } },
          { label: { zh: "C. 如果我还是认为自己的方案明显更好，会比较难全心投入自己不认同的方案", es: "C. Si sigo pensando que mi propuesta es claramente mejor, me cuesta bastante implicarme de lleno en una opción con la que no estoy de acuerdo." }, scores: { exp: 2 } },
          { label: { zh: "D. 我一般不太喜欢负责想方案，大家决定好以后我会积极配合", es: "D. Normalmente no me gusta mucho encargarme de pensar propuestas. Una vez que los demás han decidido, colaboro de buen grado." }, scores: { col: 3 } }

      {

        options: [
          { label: { zh: "A. 对方只要开口，我一般都会先过去帮忙，再回来完成自己的任务", es: "A. Si me pide ayuda, normalmente voy primero a echarle una mano y después vuelvo a terminar mi tarea." }, scores: { col: 3 } },
          { label: { zh: "B. 如果比较紧急，我会暂时放下自己的任务去帮他", es: "B. Si es algo urgente, dejo momentáneamente lo que estoy haciendo para ayudarle." }, scores: { col: 2, ada: 1 } },
          { label: { zh: "C. 先完成自己的任务，之后如果他还需要，我一定会过去帮忙", es: "C. Primero termino mi tarea y, si después sigue necesitando ayuda, voy a echarle una mano." }, scores: { col: 2 } },
          { label: { zh: "D. 我会先保证自己负责的部分不出问题，如果暂时走不开，会帮他找一个现在有余力的人", es: "D. Primero me aseguro de que mi parte esté bien hecha. Si no puedo dejarla en ese momento, busco a alguien que tenga tiempo para ayudarle." }, scores: { com: 3, col: 2, ada: 3 } }
        ]
      },
      {
        id: 15, title: { zh: "Q15. 如果让你在大家面前即兴表演 30 秒，你会？", es: "Q15. Si te pidieran hacer una actuación improvisada de 30 segundos delante de todo el mundo, ¿qué harías?" },
        options: [
          { label: { zh: "A. 我是显眼包，完全没有压力甚至享受被注视的感觉", es: "A. ¡A mí me encanta llamar la atención! No me da nada de vergüenza; incluso disfruto siendo el centro de atención." }, scores: { exp: 6 } },
          { label: { zh: "B. 有一点紧张，但是如果能加分的话，我可以", es: "B. Me pondría un poco nervioso, pero si sirve para conseguir puntos, puedo hacerlo." }, scores: { exp: 4, col: 3 } },
          { label: { zh: "C. 很紧张，实在没人了再让我去吧！", es: "C. Me pondría muy nervioso. ¡Que me toque solo si no queda absolutamente nadie más!" }, scores: { exp: 2, col: 2 } },
          { label: { zh: "D. 不可能，绝对不可能，我可以在台下鼓掌", es: "D. ¡Ni hablar, impossible! Yo puedo quedarme abajo y aplaudir." }, scores: { col: 1 } }
        ]
      },
      {
        id: 16, title: { zh: "Q16. 临时抽到一个完全没准备过的表演题目，你通常会？", es: "Q16. Si de repente te toca hacer una actuación sobre un tema que no habías preparado, ¿qué sueles hacer?" },
        options: [
          { label: { zh: "A. 先演起来再说，边演边想，说不定灵感就来了", es: "A. Empiezo a actuar y ya iré viendo. Voy improvisando sobre la marcha; quién sabe, quizá se me ocurra algo." }, scores: { ada: 6, exp: 3 } },
          { label: { zh: "B. 给我一点时间，我一般很快能想到几个点子", es: "B. Dame un poco de tiempo y normalmente se me ocurren varias ideas bastante rápido." }, scores: { ada: 6, int: 2 } },
          { label: { zh: "C. 先和大家讨论一下，有了大概方向以后我就知道怎么做了", es: "C. Primero lo hablo con los demás. Una vez que tenemos una idea general, ya sé cómo hacerlo." }, scores: { ada: 6, com: 2, col: 3 } },
          { label: { zh: "D. 我需要有人先给我一个具体方向，在完全空白的情况下比较难开始", es: "D. Necesito que alguien me dé primero una idea concreta. Si tengo que empezar desde cero, me cuesta bastante arrancar." }, scores: { col: 2, ada: 1 } }
        ]
      },
      {
        id: 17, field: 'habilidad', inputType: 'paragraph',
        title: { zh: "Q17. 你擅长什么？", es: "Q17. ¿Qué se te da bien?" },
        placeholder: { zh: "例如：足球、篮球、乐器、摄影、绘画、表演、舞蹈、剪辑、沟通、策划……", es: "Ej: Fútbol, baloncesto, tocar un instrumento, fotografía, dibujo, actuación, baile, edición, comunicación, planificación..." }
      },
      {
        id: 18, field: 'hobbie', inputType: 'paragraph',
        title: { zh: "Q18. 你的兴趣爱好是什么？", es: "Q18. ¿Cuál es tu hobbie?" },
        placeholder: { zh: "例如：电影、艺术、运动、音乐、阅读……", es: "Cine, arte, deporte, música, lectura, etc." }
      },
      {
        id: 19, field: 'frase', inputType: 'paragraph',
        title: { zh: "Q19. 用一句话形容你自己：", es: "Q19. Escribe una frase que te describa:" },
        placeholder: { zh: "例如：一个热衷于探索新事物的人……", es: "Ej: Una persona entusiasta a la que le apasiona aprender cosas nuevas..." }
      }
    ];

    function renderQuestions() {
      const container = document.getElementById('preguntas-container');
      container.innerHTML = '';

      questions.forEach((q, idx) => {
        const stepNum = idx + 1;
        let html = `
          <div class="step-card" id="step-${stepNum}">
            <h2 class="title" data-zh="${q.title.zh}" data-es="${q.title.es}">${q.title[currentLang]}</h2>
            <p class="subtitle">${stepNum} / ${questions.length}</p>
        `;

        if (q.inputType === 'paragraph') {
          html += `
            <div class="form-group">
              <textarea
                id="input-${q.field}"
                class="textarea-field"
                placeholder="${q.placeholder[currentLang]}"
                data-placeholder-zh="${q.placeholder.zh}"
                data-placeholder-es="${q.placeholder.es}"
                maxlength="500"
                rows="5"
                required
              ></textarea>
            </div>
          `;
        } else {
          q.options.forEach((opt, oIdx) => {
            html += `
              <div class="opcion-btn" onclick="selectOpt(this, ${stepNum}, ${oIdx})">
                <span data-zh="${opt.label.zh}" data-es="${opt.label.es}">${opt.label[currentLang]}</span>
              </div>
            `;
          });
        }

        const btnText = stepNum === questions.length 
          ? { zh: "生成属性卡 ✧", es: "Ver Mi Ficha ✧" } 
          : { zh: "下一题 →", es: "Siguiente →" };

        html += `
            <button type="button" class="btn-action" onclick="nextStep(${stepNum})" data-zh="${btnText.zh}" data-es="${btnText.es}">${btnText[currentLang]}</button>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    let currentRoleResult = null;

    function toggleLang() {
      currentLang = currentLang === 'es' ? 'zh' : 'es';
      document.getElementById('lang-btn').innerText = currentLang === 'es' ? '中文' : 'Español';

      document.querySelectorAll('[data-zh]').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
      });

      document.querySelectorAll('[data-placeholder-zh]').forEach(el => {
        el.placeholder = el.getAttribute(`data-placeholder-${currentLang}`);
      });

      actualizarEmojiSexo();
      if (userInfo.iglesia[currentLang]) document.getElementById('res-iglesia').innerText = userInfo.iglesia[currentLang];
      if (userInfo.edad[currentLang]) document.getElementById('res-edad').innerText = userInfo.edad[currentLang];
      if (userInfo.habilidad) document.getElementById('res-habilidad').innerText = userInfo.habilidad;

      if (currentRoleResult) {
        mostrarDatosRol(currentRoleResult);
      }

      if (currentScores) actualizarEstadisticasIdioma(currentScores);
    }

    function mostrarDatosRol(roleResult) {
      let nombreRol = "";
      if (ROLE_NAMES[roleResult.role_key]) {
        nombreRol = ROLE_NAMES[roleResult.role_key][currentLang];
      } else {
        nombreRol = roleResult.role_key;
      }

      let tipoNucleo = roleResult.core_type?.[currentLang] || roleResult.core_type || "";
      let descRol = roleResult.description?.[currentLang] || roleResult.description || "";

      if (document.getElementById('res-rol')) document.getElementById('res-rol').innerText = nombreRol;
      if (document.getElementById('res-tipo-nucleo')) document.getElementById('res-tipo-nucleo').innerText = tipoNucleo;
      if (document.getElementById('res-desc-rol')) document.getElementById('res-desc-rol').innerText = descRol;
    }

    function seleccionarSexo(elem, sexo) {
      document.querySelectorAll('.sexo-btn').forEach(b => b.classList.remove('selected'));
      elem.classList.add('selected');

      const etiquetas = {
        hombre: { es: 'Hombre', zh: '男性' },
        mujer: { es: 'Mujer', zh: '女性' }
      };

      userInfo.sexo = etiquetas[sexo];
      actualizarEmojiSexo();
    }

    const AVATAR_HOMBRE = '🙋‍♂️';
    const AVATAR_MUJER = '🙋‍♀️';

    function actualizarEmojiSexo() {
      const avatarEl = document.getElementById('res-sexo-emoji');
      if (!avatarEl) return;
      const sexoGuardado = userInfo.sexo?.es || userInfo.sexo || '';
      avatarEl.textContent = sexoGuardado === 'Mujer' ? AVATAR_MUJER : AVATAR_HOMBRE;
    }

    function iniciarPreguntas() {
      const nombre = document.getElementById('input-nombre').value.trim();
      if (!nombre) {
        alert(currentLang === 'es' ? 'Por favor, introduce tu nombre.' : '请输入你的姓名。');
        document.getElementById('input-nombre').focus();
        return;
      }
      if (!userInfo.sexo.es) {
        alert(currentLang === 'es' ? 'Por favor, selecciona tu sexo.' : '请选择你的性别。');
        return;
      }

      document.getElementById('step-0').classList.remove('active');
      currentStep = 1;
      document.getElementById('step-1').classList.add('active');
    }

    function selectOpt(elem, step, optIndex) {
      const parent = elem.parentElement;
      parent.querySelectorAll('.opcion-btn').forEach(b => b.classList.remove('selected'));
      elem.classList.add('selected');

      const q = questions[step - 1];
      if (q.field) {
        userInfo[q.field] = q.options[optIndex].label;
      } else {
        selectedAnswers[step] = q.options[optIndex].scores;
      }
    }

    function nextStep(step) {
      const q = questions[step - 1];

      if (q.inputType === 'paragraph' || q.inputType === 'text') {
        const input = document.getElementById(`input-${q.field}`);
        const value = input ? input.value.trim() : '';
        if (!value) {
          alert(currentLang === 'es' ? 'Por favor, completa este campo.' : '请填写此项内容。');
          if (input) input.focus();
          return;
        }
        userInfo[q.field] = value;
      } else if (q.field && !userInfo[q.field].es) {
        alert(currentLang === 'es' ? 'Por favor selecciona una opción' : '请选择一个选项');
        return;
      } else if (!q.field && !selectedAnswers[step]) {
        alert(currentLang === 'es' ? 'Por favor selecciona una opción' : '请选择一个选项');
        return;
      }

      document.getElementById(`step-${step}`).classList.remove('active');
      if (step < questions.length) {
        currentStep = step + 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
      } else {
        generarResultado();
      }
    }

    async function enviarResultadoPorCorreo(scores, userData, roleResult) {
      if (!window.emailjs || EMAILJS_PUBLIC_KEY === 'TU_PUBLIC_KEY' || EMAILJS_SERVICE_ID === 'TU_SERVICE_ID' || EMAILJS_TEMPLATE_ID === 'TU_TEMPLATE_ID') {
        console.warn('EmailJS no está configurado.');
        return false;
      }

      const rolNombre = ROLE_NAMES[roleResult.role_key]?.es || roleResult.role_key;

      const params = {
        nombre: userData.nombre || '-',
        sexo: userData.sexo?.es || userData.sexo || '-',
        iglesia: userData.iglesia?.es || userData.iglesia || '-',
        edad: userData.edad?.es || userData.edad || '-',
        habilidad: userData.habilidad || '-',
        hobbie: userData.hobbie || '-',
        frase: userData.frase || '-',
        rol: rolNombre,
        tipo_nucleo: roleResult.core_type?.es || roleResult.core_type,
        descripcion_rol: roleResult.description?.es || roleResult.description,
        fisico: `${scores.fis}/24`,
        intelecto: `${scores.int}/24`,
        expresion: `${scores.exp}/24`,
        comunicacion: `${scores.com}/24`,
        colaboracion: `${scores.col}/24`,
        adaptabilidad: `${scores.ada}/24`,
        resultado_url: window.location.href,
        fecha: new Date().toLocaleString('es-ES')
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);
        return true;
      } catch (error) {
        console.error('Error al enviar email:', error);
        return false;
      }
    }

    function actualizarEstadisticasIdioma(scores) {
      const getLevel = val => Math.min(6, Math.floor(val / 4) + 1);
      const statsMap = [
        { key: 'fis', zh: '体能', es: 'Físico', icon: '🏃‍♂️', val: scores.fis },
        { key: 'int', zh: '脑力', es: 'Intelecto', icon: '🧠', val: scores.int },
        { key: 'exp', zh: '表达', es: 'Expresión', icon: '🗣️', val: scores.exp },
        { key: 'com', zh: '沟通', es: 'Comunicación', icon: '💬', val: scores.com },
        { key: 'col', zh: '协作', es: 'Colaboración', icon: '🤝', val: scores.col },
        { key: 'ada', zh: '应变', es: 'Adaptabilidad', icon: '⚡', val: scores.ada }
      ];

      const badgesContainer = document.getElementById('stats-badges');
      if (badgesContainer) {
        badgesContainer.innerHTML = '';
        statsMap.forEach(s => {
          const nivel = getLevel(s.val);
          badgesContainer.innerHTML += `
            <div class="stat-badge-item">
              <span class="stat-badge-icon">${s.icon}</span>
              <div class="stat-badge-name">${currentLang === 'es' ? s.es : s.zh}</div>
              <div class="stat-badge-val">${s.val}/24</div>
              <div class="stat-badge-level">${currentLang === 'es' ? 'Nivel ' + nivel : '等级 ' + nivel}</div>
            </div>
          `;
        });
      }

      const canvas = document.getElementById('radarChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: statsMap.map(s => {
            const radarEs = { fis: 'Fís.', int: 'Int.', exp: 'Expr.', com: 'Com.', col: 'Col.', ada: 'Adap.' };
            return `${s.icon} ${currentLang === 'es' ? radarEs[s.key] : s.zh}`;
          }),
          datasets: [{
            data: statsMap.map(s => s.val),
            backgroundColor: 'rgba(77, 124, 254, 0.25)',
            borderColor: '#4d7cfe',
            borderWidth: 2,
            pointBackgroundColor: '#4d7cfe',
            pointRadius: 4
          }]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              angleLines: { color: '#e2e8f0' },
              grid: { color: '#f1f5f9' },
              pointLabels: { color: '#475569', padding: 4, font: { family: 'Plus Jakarta Sans', size: 10, weight: '700' } },
              ticks: { display: false },
              suggestedMin: 0,
              suggestedMax: 24
            }
          }
        }
      });
    }

    function generarResultado(datosGuardados = null) {
      let scores;
      let userData;
      let roleResult;

      if (datosGuardados) {
        scores = datosGuardados.scores;
        userData = datosGuardados.userData;
        roleResult = datosGuardados.roleResult || classifyRole(scores);
      } else {
        scores = { fis: 0, int: 0, exp: 0, com: 0, col: 0, ada: 0 };
        Object.values(selectedAnswers).forEach(s => {
          if (s) {
            if (s.fis) scores.fis += s.fis;
            if (s.int) scores.int += s.int;
            if (s.exp) scores.exp += s.exp;
            if (s.com) scores.com += s.com;
            if (s.col) scores.col += s.col;
            if (s.ada) scores.ada += s.ada;
          }
        });

        Object.keys(scores).forEach(k => { if (scores[k] > 24) scores[k] = 24; });

        userData = {
          nombre: document.getElementById('input-nombre').value.trim(),
          sexo: userInfo.sexo,
          iglesia: userInfo.iglesia,
          edad: userInfo.edad,
          habilidad: userInfo.habilidad,
          hobbie: userInfo.hobbie,
          frase: userInfo.frase
        };

        roleResult = classifyRole(scores);

        localStorage.setItem('userQuizStats', JSON.stringify({
          scores: scores,
          userData: userData,
          roleResult: roleResult,
          emailEnviado: false
        }));

        enviarResultadoPorCorreo(scores, userData, roleResult).then(enviado => {
          if (enviado) {
            const datosActualizados = JSON.parse(localStorage.getItem('userQuizStats') || '{}');
            datosActualizados.emailEnviado = true;
            localStorage.setItem('userQuizStats', JSON.stringify(datosActualizados));
          }
        });
      }

      currentScores = scores;
      currentRoleResult = roleResult;

      // Rellenar Ficha Datos Básicos
      document.getElementById('res-nombre').innerText = userData.nombre || '-';
      const sexoValor = userData.sexo?.es || userData.sexo || '';
      document.getElementById('res-sexo-emoji').textContent = sexoValor === 'Mujer' ? AVATAR_MUJER : AVATAR_HOMBRE;
      document.getElementById('res-iglesia').innerText = userData.iglesia?.[currentLang] || userData.iglesia?.es || '-';
      document.getElementById('res-edad').innerText = userData.edad?.[currentLang] || userData.edad?.es || '-';
      document.getElementById('res-habilidad').innerText = userData.habilidad || '-';

      if (document.getElementById('res-hobbie')) document.getElementById('res-hobbie').innerText = userData.hobbie || '-';
      if (document.getElementById('res-frase')) document.getElementById('res-frase').innerText = userData.frase || '-';

      // Rellenar Rol y Descripción según idioma
      mostrarDatosRol(roleResult);

      actualizarEstadisticasIdioma(scores);

      document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
      document.getElementById('resultado-screen').style.display = 'block';
    }

    function initApp() {
      const savedData = localStorage.getItem('userQuizStats');
      if (savedData) {
        generarResultado(JSON.parse(savedData));
      } else {
        renderQuestions();
      }
    }

    function intentarReiniciar() {
      const mensaje = currentLang === 'es' ? "Introduce la contraseña de administrador:" : "请输入管理员密码以重置:";
      const password = prompt(mensaje);
      if (password === '20012000') {
        localStorage.removeItem('userQuizStats');
        location.reload();
      } else if (password !== null) {
        alert(currentLang === 'es' ? "Contraseña incorrecta." : "密码错误。");
      }
    }

    initApp();
  </script>
