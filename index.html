<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Stats & Perfil - 个人属性卡</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-page: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent-blue: #4d7cfe;
      --accent-light: rgba(77, 124, 254, 0.12);
      --border-color: #edf2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 28px 24px;
      position: relative;
    }

    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--accent-blue);
      transition: all 0.2s;
    }

    .lang-switcher:hover {
      background: var(--accent-light);
    }

    .step-card { display: none; }
    .step-card.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2.title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    p.subtitle { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .input-field {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color);
      border-radius: 12px; font-family: inherit; font-size: 0.95rem; outline: none; background: #fff;
    }

    .opcion-btn {
      background: #f8fafc; border: 1.5px solid var(--border-color); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center;
      transition: all 0.2s; font-size: 0.9rem; font-weight: 500; line-height: 1.4;
    }

    .opcion-btn:hover { border-color: #cbd5e1; background: #f1f5f9; }
    .opcion-btn.selected { border-color: var(--accent-blue); background: var(--accent-light); color: var(--accent-blue); font-weight: 600; }

    .btn-action {
      width: 100%; background: var(--accent-blue); color: #fff; border: none; border-radius: 14px;
      padding: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 12px;
      box-shadow: 0 4px 12px rgba(77, 124, 254, 0.3);
    }

    #resultado-screen { display: none; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
    @media (max-width: 500px) { .profile-grid { grid-template-columns: 1fr; } }

    .info-col { display: flex; flex-direction: column; justify-content: center; }
    .user-name-box { background: #f8fafc; padding: 8px 16px; border-radius: 20px; font-size: 1.2rem; font-weight: 800; text-align: center; margin-bottom: 16px; }
    .info-list { display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
    .info-item { display: flex; align-items: flex-start; gap: 8px; color: var(--text-muted); }

    .chart-col { display: flex; justify-content: center; align-items: center; }
    .chart-box { width: 100%; max-width: 290px; }

    .stats-badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .stat-badge-item { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 4px; text-align: center; }
    .stat-badge-icon { font-size: 1.1rem; display: block; }
    .stat-badge-name { font-size: 0.7rem; font-weight: 700; color: var(--text-main); }
    .stat-badge-val { font-size: 0.75rem; font-weight: 800; color: var(--accent-blue); }
    .stat-badge-level { font-size: 0.65rem; background: #e0f2fe; color: #0369a1; border-radius: 10px; padding: 1px 6px; display: inline-block; margin-top: 2px; }

    .keywords-section { padding-top: 16px; }
    .keywords-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
    .tags-flex { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .tag-yellow { background: #fef3c7; color: #d97706; }
    .tag-blue { background: #e0f2fe; color: #0284c7; }
    .tag-green { background: #dcfce7; color: #15803d; }
  </style>
</head>

          { label: { zh: "D. 先保证自己的部分,走不开会帮他找有余力的人", es: "D. Aseguro mi parte y le busco a alguien disponible." }, scores: { com: 3, col: 2, ada: 3 } }
        ]
      },
      {
        id: 15,
        title: { zh: "Q15. 如果让你在大家面前即兴表演30秒?", es: "Q15. Si te piden improvisar en público por 30 segundos..." },
        options: [
          { label: { zh: "A. 完全没有压力甚至享受被注视的感觉", es: "A. Sin presión, ¡hasta disfruto la atención del público!" }, scores: { exp: 6 } },
          { label: { zh: "B. 有一点紧张,但是如果能加分的话,我可以", es: "B. Algo nervioso, pero si suma puntos para el equipo, ¡voy!" }, scores: { exp: 4, col: 3 } },
          { label: { zh: "C. 很紧张,实在没人了再让我去吧!", es: "C. Muy nervioso. ¡Déjenme como última opción!" }, scores: { exp: 2, col: 2 } },
          { label: { zh: "D. 不可能,绝对不可能,我可以在台下鼓掌", es: "D. Imposible. Me quedo abajo aplaudiendo." }, scores: { col: 1 } }
        ]
      },
      {
        id: 16,
        title: { zh: "Q16. 临时抽到一个完全没准备过的表演题目?", es: "Q16. Si te toca actuar un tema improvisado sin preparación..." },
        options: [
          { label: { zh: "A. 先演起来再说,边演边想,说不定灵感就来了", es: "A. Actúo de una vez; sobre la marcha surge la inspiración." }, scores: { ada: 6, exp: 3 } },
          { label: { zh: "B. 给我一点时间,我一般很快能想到几个点子", es: "B. Dame un momento y se me ocurrirán varias ideas." }, scores: { ada: 6, int: 2 } },
          { label: { zh: "C. 先和大家讨论下,有了大概方向就知道怎么做了", es: "C. Discuto la idea con el grupo y me pongo a trabajar." }, scores: { ada: 6, com: 2, col: 3 } },
          { label: { zh: "D. 需要有人先给我具体方向,完全空白比较难开始", es: "D. Necesito una guía clara; de la nada me cuesta empezar." }, scores: { col: 2, ada: 1 } }
        ]
      }
    ];

    function renderQuestions() {
      const container = document.getElementById('preguntas-container');
      container.innerHTML = '';

      questions.forEach((q, idx) => {
        const stepNum = idx + 1;
        let html = `
          <div class="step-card" id="step-${stepNum}">
            <h2 class="title" data-zh="${q.title.zh}" data-es="${q.title.es}">${q.title[currentLang]}</h2>
            <p class="subtitle">${stepNum} / ${questions.length}</p>
        `;

        q.options.forEach((opt, oIdx) => {
          html += `
            <div class="opcion-btn" onclick="selectOpt(this, ${stepNum}, ${oIdx})">
              <span data-zh="${opt.label.zh}" data-es="${opt.label.es}">${opt.label[currentLang]}</span>
            </div>
          `;
        });

        const btnText = stepNum === questions.length 
          ? { zh: "生成属性卡 ✧", es: "Ver Mi Ficha ✧" } 
          : { zh: "下一题 →", es: "Siguiente →" };

        html += `
            <button type="button" class="btn-action" onclick="nextStep(${stepNum})" data-zh="${btnText.zh}" data-es="${btnText.es}">${btnText[currentLang]}</button>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    function toggleLang() {
      currentLang = currentLang === 'es' ? 'zh' : 'es';
      document.getElementById('lang-btn').innerText = currentLang === 'es' ? '中文' : 'Español';

      document.querySelectorAll('[data-zh]').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
      });
      
      // Actualizar el texto del resultado si ya se guardó
      if (userInfo.iglesia[currentLang]) {
        document.getElementById('res-iglesia').innerText = userInfo.iglesia[currentLang];
      }
      if (userInfo.edad[currentLang]) {
        document.getElementById('res-edad').innerText = userInfo.edad[currentLang];
      }
    }

    function iniciarPreguntas() {
      document.getElementById('step-0').classList.remove('active');
      currentStep = 1;
      document.getElementById('step-1').classList.add('active');
    }

    function selectOpt(elem, step, optIndex) {
      const parent = elem.parentElement;
      parent.querySelectorAll('.opcion-btn').forEach(b => b.classList.remove('selected'));
      elem.classList.add('selected');
      
      const q = questions[step - 1];
      
      // Si la pregunta es un campo de info (Iglesia o Edad), guardamos el texto en ambos idiomas
      if (q.field) {
        userInfo[q.field] = q.options[optIndex].label;
      } else {
        selectedAnswers[step] = q.options[optIndex].scores;
      }
    }

    function nextStep(step) {
      const q = questions[step - 1];
      // Validación diferente si es pregunta informativa o de puntuación
      if (q.field && !userInfo[q.field].es) {
        alert(currentLang === 'es' ? "Por favor selecciona una opción" : "请选择一个选项");
        return;
      } else if (!q.field && !selectedAnswers[step]) {
        alert(currentLang === 'es' ? "Por favor selecciona una opción" : "请选择一个选项");
        return;
      }

      document.getElementById(`step-${step}`).classList.remove('active');
      if (step < questions.length) {
        currentStep = step + 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
      } else {
        generarResultado();
      }
    }

    function generarResultado(datosGuardados = null) {
      let scores;
      let userData;

      // Si venimos de localStorage, cargamos los datos guardados
      if (datosGuardados) {
        scores = datosGuardados.scores;
        userData = datosGuardados.userData;
      } else {
        // Si es la primera vez que hace el test, calculamos
        scores = { fis: 0, int: 0, exp: 0, com: 0, col: 0, ada: 0 };
        Object.values(selectedAnswers).forEach(s => {
          if (s.fis) scores.fis += s.fis;
          if (s.int) scores.int += s.int;
          if (s.exp) scores.exp += s.exp;
          if (s.com) scores.com += s.com;
          if (s.col) scores.col += s.col;
          if (s.ada) scores.ada += s.ada;
        });

        Object.keys(scores).forEach(k => {
          if (scores[k] > 24) scores[k] = 24;
        });

        userData = {
          nombre: document.getElementById('input-nombre').value || 'Alex',
          // ELIMINA ESTA LÍNEA: lema: document.getElementById('input-lema').value || '-',
          iglesia: userInfo.iglesia,
          edad: userInfo.edad
        };

        // Guardar en el navegador para evitar repeticiones
        localStorage.setItem('userQuizStats', JSON.stringify({
          scores: scores,
          userData: userData
        }));
      }

      // Rellenar Ficha
      document.getElementById('res-nombre').innerText = userData.nombre;
      document.getElementById('res-iglesia').innerText = userData.iglesia[currentLang] || '-';
      document.getElementById('res-edad').innerText = userData.edad[currentLang] || '-';

      // Lógica de la imagen: 每4分为一档 (1 nivel cada 4 puntos)
      const getLevel = val => Math.min(6, Math.floor(val / 4) + 1);

      const statsMap = [
        { key: 'fis', zh: '体能', es: 'Físico', icon: '🏃‍♂️', val: scores.fis },
        { key: 'int', zh: '脑力', es: 'Intelecto', icon: '🧠', val: scores.int },
        { key: 'exp', zh: '表达', es: 'Expresión', icon: '🗣️', val: scores.exp },
        { key: 'com', zh: '沟通', es: 'Comunicación', icon: '💬', val: scores.com },
        { key: 'col', zh: '协作', es: 'Colaboración', icon: '🤝', val: scores.col },
        { key: 'ada', zh: '应变', es: 'Adaptabilidad', icon: '⚡', val: scores.ada }
      ];

      const badgesContainer = document.getElementById('stats-badges');
      badgesContainer.innerHTML = '';
      statsMap.forEach(s => {
        badgesContainer.innerHTML += `
          <div class="stat-badge-item">
            <span class="stat-badge-icon">${s.icon}</span>
            <div class="stat-badge-name" data-zh="${s.zh}" data-es="${s.es}">${currentLang === 'es' ? s.es : s.zh}</div>
            <div class="stat-badge-val">${s.val}/24</div>
            <div class="stat-badge-level" data-zh="${getLevel(s.val)}档" data-es="Nivel ${getLevel(s.val)}">${currentLang === 'es' ? 'Nivel ' + getLevel(s.val) : getLevel(s.val) + '档'}</div>
          </div>
        `;
      });

      // Ocultar paso actual y mostrar resultados
      document.querySelectorAll('.step-card').forEach(el => el.classList.remove('active'));
      document.getElementById('resultado-screen').style.display = 'block';

      // Gráfico Radar
      const ctx = document.getElementById('radarChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: statsMap.map(s => `${s.icon} ${currentLang === 'es' ? s.es : s.zh}`),
          datasets: [{
            data: statsMap.map(s => s.val),
            backgroundColor: 'rgba(77, 124, 254, 0.25)',
            borderColor: '#4d7cfe',
            borderWidth: 2,
            pointBackgroundColor: '#4d7cfe',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              angleLines: { color: '#e2e8f0' },
              grid: { color: '#f1f5f9' },
              pointLabels: { color: '#475569', font: { family: 'Plus Jakarta Sans', size: 10, weight: '700' } },
              ticks: { display: false },
              suggestedMin: 0,
              suggestedMax: 24
            }
          }
        }
      });
    }

    // LÓGICA DE INICIALIZACIÓN Y BLOQUEO DE REPETICIÓN
    function initApp() {
      const savedData = localStorage.getItem('userQuizStats');
      if (savedData) {
        // Si ya hay datos, saltar directamente a la pantalla de resultados
        generarResultado(JSON.parse(savedData));
      } else {
        // Si no hay datos, mostrar el test normal
        renderQuestions();
      }
    }

    function intentarReiniciar() {
  // Pide la contraseña respetando el idioma actual
  const mensaje = currentLang === 'es' 
    ? "Introduce la contraseña de administrador para reiniciar:" 
    : "请输入管理员密码以重置:";
  
  const password = prompt(mensaje);
  
  if (password === '20012000') {
    // Si es correcta, borra los datos guardados y recarga la página
    localStorage.removeItem('userQuizStats');
    location.reload();
  } else if (password !== null) {
    // Si es incorrecta (y el usuario no le dio a cancelar), muestra una alerta
    alert(currentLang === 'es' ? "Contraseña incorrecta." : "密码错误。");
  }
}
    // Reemplaza la llamada final a renderQuestions() por initApp()
    initApp();

  </script>
